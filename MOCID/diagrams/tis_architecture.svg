<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Temporal Interpolation Scan (TIS)</title>
<desc>Flowchart of TIS execution: inputs are spatially pooled, interleaved along a 1D timeline, and directed through bidirectional selective scanning modules before gathering into the spatial map configuration.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g style="font-family:sans-serif; font-size:14px;">
<rect x="60" y="20" width="260" height="50" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="190" y="45" text-anchor="middle" fill="#444445" font-weight="500">Features &amp; SDS Param Branches</text>
<rect x="360" y="20" width="260" height="50" rx="6" fill="#fef6e6" stroke="#b77a30" stroke-width="0.5"/>
<text x="490" y="45" text-anchor="middle" fill="#7e5418" font-weight="500">Pooling Scale (1x2) &amp; (2x1)</text>
<path d="M 190 70 L 190 100 L 300 120" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 490 70 L 490 100 L 380 120" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="120" width="240" height="50" rx="6" fill="#eef3fe" stroke="#4a74b7" stroke-width="0.5"/>
<text x="340" y="145" text-anchor="middle" fill="#2c4c7e" font-weight="500">Spatial Pooling &amp; Interleaving</text>
<line x1="340" y1="170" x2="340" y2="210" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="210" width="240" height="50" rx="6" fill="#fbeefa" stroke="#a32ea1" stroke-width="0.5"/>
<text x="340" y="245" text-anchor="middle" fill="#611b60" font-weight="500">Bidirectional Selective Scan</text>
<line x1="340" y1="260" x2="340" y2="300" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="300" width="240" height="50" rx="6" fill="#edfdf3" stroke="#2ea366" stroke-width="0.5"/>
<text x="340" y="325" text-anchor="middle" fill="#1b613c" font-weight="500">Forward + Backward Fusion (+)</text>
<line x1="340" y1="350" x2="340" y2="390" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="390" width="240" height="50" rx="6" fill="#fcfcfc" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="415" text-anchor="middle" fill="#444445">Spatial Reshape Output</text>
</g>
</svg>
