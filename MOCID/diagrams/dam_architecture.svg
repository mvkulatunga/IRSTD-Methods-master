<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Displacement-aware Mamba (DAM) Module</title>
<desc>Flowchart of the full DAM block: target and reference frames go through projection setups, interact inside the TIDS block, scale against activation variables, and combine via a structural residual loop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g style="font-family:sans-serif; font-size:14px;">
<rect x="40" y="20" width="160" height="50" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="120" y="45" text-anchor="middle" fill="#444445" font-weight="500">Input Feature maps</text>
<path d="M 120 70 L 120 420 L 310 420" fill="none" stroke="#e06666" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
<text x="130" y="240" fill="#cc0000" font-weight="500">Residual Path</text>
<path d="M 200 45 L 340 45" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="20" width="240" height="50" rx="6" fill="#eef3fe" stroke="#4a74b7" stroke-width="0.5"/>
<text x="460" y="45" text-anchor="middle" fill="#2c4c7e" font-weight="500">LayerNorm &amp; Linear Projections</text>
<line x1="460" y1="70" x2="460" y2="110" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="110" width="240" height="50" rx="6" fill="#feebe6" stroke="#b74a30" stroke-width="0.5"/>
<text x="460" y="135" text-anchor="middle" fill="#7e2c18" font-weight="500">Depthwise 2D Conv + SiLU</text>
<line x1="460" y1="160" x2="460" y2="200" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="200" width="240" height="50" rx="6" fill="#fbeefa" stroke="#a32ea1" stroke-width="0.5"/>
<text x="460" y="225" text-anchor="middle" fill="#611b60" font-weight="500">TIDS Mechanism (SDS + TIS)</text>
<line x1="460" y1="250" x2="460" y2="290" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="290" width="240" height="50" rx="6" fill="#edfdf3" stroke="#2ea366" stroke-width="0.5"/>
<text x="460" y="315" text-anchor="middle" fill="#1b613c" font-weight="500">Gate Multiplication (x * silu(z))</text>
<line x1="460" y1="340" x2="460" y2="380" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="380" width="240" height="50" rx="6" fill="#eef3fe" stroke="#4a74b7" stroke-width="0.5"/>
<text x="460" y="405" text-anchor="middle" fill="#2c4c7e" font-weight="500">Out Linear Projection</text>
<path d="M 340 405 L 325 405" fill="none" stroke="#898781" stroke-width="1.5"/>
<circle cx="325" cy="405" r="12" fill="#fff" stroke="#cc0000" stroke-width="2"/>
<text x="325" y="409" text-anchor="middle" fill="#cc0000" font-weight="bold">+</text>
<line x1="325" y1="417" x2="325" y2="440" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="455" fill="#444445">Enhanced Output Feature Map</text>
</g>
</svg>
